name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: "Rust crates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: "Install numpy for parity tests"
        run: pip install numpy
      - name: "fluid-stratos: build"
        run: cargo build --manifest-path crates/fluid-stratos/Cargo.toml
      - name: "fluid-stratos: regression tests"
        run: cargo test --manifest-path crates/fluid-stratos/Cargo.toml
      - name: "fluid-stratos: parity test (Rust vs fixture)"
        run: |
          cargo run --manifest-path crates/fluid-stratos/Cargo.toml --example gpe_parity > parity_rust.json
          python scripts/check_parity_fixture.py parity_rust.json tests/fixtures/gpe_parity.json
      - name: "fluid-stratos: parity test (numpy vs fixture)"
        run: |
          python scripts/gpe_parity.py --load-psi0 > parity_numpy.json
          python scripts/check_parity_fixture.py parity_numpy.json tests/fixtures/gpe_parity.json
      - name: "fluid-stratos: serial vs parallel parity"
        run: cargo test --manifest-path crates/fluid-stratos/Cargo.toml test_parallel_step -- --nocapture
      - name: "quantum-bridge: build"
        run: cargo build --manifest-path crates/quantum-bridge/Cargo.toml
      - name: "quantum-bridge: tests"
        run: cargo test --manifest-path crates/quantum-bridge/Cargo.toml
      - name: "clippy"
        run: |
          cargo clippy --manifest-path crates/fluid-stratos/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path crates/quantum-bridge/Cargo.toml --all-targets -- -D warnings
      - name: "formatting"
        run: |
          cargo fmt --manifest-path crates/fluid-stratos/Cargo.toml -- --check
          cargo fmt --manifest-path crates/quantum-bridge/Cargo.toml -- --check

  python:
    name: "Measurement scripts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: "install dependencies"
        # The numpy version is pinned on purpose. Measured 2026-11-01: the
        # simulation output is byte identical under numpy 2.4.6 (what Python
        # 3.11 resolves to) and numpy 2.5.4, but NOT under numpy 1.26.4 --
        # numpy's Generator.binomial stream differs between the 1.x and the
        # 2.x line. Without the pin, a numpy release could change the
        # committed measurement file and the "git diff --exit-code" gate
        # below would fail for a third party reason.
        run: pip install "numpy==2.4.6"
      - name: "the 10-shot mathematics"
        run: python scripts/quantum_10shot_math.py
      - name: "the fluid awakening measurement"
        run: python scripts/gpe_fft_measurement.py
      - name: "the raw measurement summary"
        run: python scripts/summarize_hardware_run.py
      - name: "the quantum channel conventions (must match the hardware)"
        run: python scripts/test_quantum_loop_sim.py
      - name: "the quantum-classical loop simulation (1000 iterations)"
        run: python scripts/quantum_loop_sim.py
      - name: "the committed CPU result must match the regenerated one"
        run: git diff --exit-code measurement_cpu/quantum-loop-results.json
      - name: "hardware replay (the 2026-10-27 runs used the pre-fix solver)"
        run: python scripts/replay_hardware_log.py
      - name: "the regenerated loop summary must match the committed one"
        run: git diff --exit-code measurement_raw/loop_summary_20261027T003737Z_replay.json
      - name: "hygiene gate self-test (leak detection vs false positives)"
        run: python scripts/test_check_hygiene.py
      - name: "hygiene gate end-to-end (reintroduced leak must fail the gate)"
        run: python scripts/test_hygiene_e2e.py
      - name: "hygiene check (no personal paths)"
        run: python scripts/check_hygiene.py

  paper:
    name: "Build paper PDF"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install TeX Live"
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full biber
      - name: "Compile paper"
        working-directory: paper
        run: |
          pdflatex aisc2027_unified_paper.tex
          bibtex aisc2027_unified_paper
          pdflatex aisc2027_unified_paper.tex
          pdflatex aisc2027_unified_paper.tex
      - name: "Upload PDF artifact"
        uses: actions/upload-artifact@v4
        with:
          name: aisc2027-paper
          path: paper/aisc2027_unified_paper.pdf
          retention-days: 30
